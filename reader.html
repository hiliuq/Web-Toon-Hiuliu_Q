<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiLiu_Q • Reader</title><style>:root{--bg:#07080b;--card:#11131a;--line:#252a35;--txt:#f7f8fb;--muted:#969cab;--a:#8d7bff}*{box-sizing:border-box}body{margin:0;color:var(--txt);background:var(--bg);font:14px system-ui}header{position:sticky;top:0;z-index:3;background:rgba(7,8,11,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:center;justify-content:space-between}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.input,button,select,textarea{font:inherit}.input,select,textarea{background:#0d0f14;color:#fff;border:1px solid var(--line);padding:10px;border-radius:10px}button{background:#12151b;color:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px}.primary{background:linear-gradient(135deg,rgba(141,123,255,.4),rgba(91,230,255,.12))}.wrap{width:min(1000px,calc(100% - 20px));margin:auto}.pages img{display:block;width:100%;height:auto;margin:0 auto 4px;background:#0b0d12}.reader-top{padding:12px 0}.muted{color:var(--muted)}.comments{padding:16px 0 60px}.comment{padding:10px;border-bottom:1px solid var(--line)}.badge{padding:5px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}</style></head><body><header><div class="bar"><button onclick="location.href='/'">← Home</button><button id="prev">◀</button><select id="chapterSelect"></select><button id="next">▶</button></div><div class="bar"><span class="badge">Auto Scroll</span><select id="speed"><option value="0">OFF</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select><button id="toggle">▶</button></div></header><div class="wrap"><div class="reader-top"><h2 id="title">Reader</h2><div class="muted" id="meta"></div></div><main id="pages" class="pages"></main><section class="comments"><h3>💬 Bình luận</h3><textarea id="commentInput" rows="4" style="width:100%" placeholder="Viết bình luận..."></textarea><button id="commentSend" class="primary" style="margin-top:8px">Gửi</button><div id="comments"></div></section></div><script>
const API=location.origin;let storyId=new URLSearchParams(location.search).get('story');let chapterId=new URLSearchParams(location.search).get('chapter');let story=null, chapters=[], timer=null;const $=s=>document.querySelector(s);async function j(u,o){const r=await fetch(API+u,{credentials:'include',...o});const b=await r.json();if(!r.ok)throw Error(b.message||'Lỗi');return b}
async function init(){if(!storyId&&chapterId){const c=await j('/api/chapters/'+chapterId);$('title').textContent=c.chapter.story_title;chapterId=c.chapter.id;await renderChapter(c.chapter)}else if(storyId){const s=await j('/api/stories/'+storyId);story=s.story;chapters=s.chapters;fillChapters();const c=chapterId?chapters.find(x=>String(x.id)===String(chapterId)):chapters[0];if(c) {chapterId=c.id;const d=await j('/api/chapters/'+c.id);renderChapter(d.chapter)}else $('meta').textContent='Chưa có chapter.'} }
function fillChapters(){const x=$('#chapterSelect');x.innerHTML=chapters.map(c=>`<option value="${c.id}">Chapter ${c.number} ${c.title||''}</option>`).join('');x.value=chapterId||chapters[0]?.id||'';x.onchange=()=>go(x.value)}async function go(id){chapterId=id;location.search='?story='+storyId+'&chapter='+id}async function renderChapter(ch){$('title').textContent=(story?.title||ch.story_title)+' — Chapter '+ch.number;$('meta').textContent=`${ch.image_count} ảnh`;$('#pages').innerHTML=ch.images.map((u,i)=>`<img loading="lazy" src="${u}" alt="${i+1}">`).join('');$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);loadComments()}
function move(d){const i=chapters.findIndex(x=>String(x.id)===String(chapterId));const n=chapters[i+d];if(n)go(n.id)}
$('#toggle').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#toggle').textContent='▶'}else{const sp=Number($('#speed').value)||3;timer=setInterval(()=>scrollBy({top:Math.max(1,sp*1.8),behavior:'auto'}),30);$('#toggle').textContent='⏸'}};$('#speed').onchange=()=>{if(timer){clearInterval(timer);timer=null;$('#toggle').click()}};
async function loadComments(){if(!storyId)return;const b=await j('/api/comments?story_id='+storyId+'&chapter_id='+chapterId);$('#comments').innerHTML=b.comments.map(c=>`<div class="comment"><b>${c.username||'User'}</b><div class="muted">${escapeHtml(c.content)}</div></div>`).join('')}
$('#commentSend').onclick=async()=>{const content=$('#commentInput').value.trim();if(!content)return;try{await j('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_id:Number(storyId),chapter_id:Number(chapterId),content})});$('#commentInput').value='';loadComments()}catch(e){alert(e.message)}};function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init().catch(e=>alert(e.message));
</script></body></html>
